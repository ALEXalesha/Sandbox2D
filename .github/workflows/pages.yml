# Игра на GitHub Pages. web/ - сайт целиком как есть: обычные скрипты, PixiJS лежит в
# web/vendor, ни сборки, ни npm install. Те же файлы работают в Electron и с диска.
# Pages в настройках репозитория включает владелец; до этого шаг выкладки падает, сборка - нет.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка сайта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Разложить сайт
        run: |
          mkdir -p _site
          cp -r web/. _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    name: Выкладка
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
